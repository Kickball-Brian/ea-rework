[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── Legacy WordPress URLs — live pages with no equivalent route ─────────────
# /solutions/ was a real hub page on the live site; the rebuild never got one,
# so send it where the nav's own "Solutions" link goes.
[[redirects]]
  from = "/solutions"
  to = "/#ea-solutions"
  status = 301
[[redirects]]
  from = "/solutions/"
  to = "/#ea-solutions"
  status = 301

# /solutions/data-lists/ had real content (list segmentation/targeting) with
# no matching solution in the rebuild — closest topical match.
[[redirects]]
  from = "/solutions/data-lists/"
  to = "/solutions/lead-generation"
  status = 301

# /mtmp/, /ntl-summit/, /articles/ — no content worth preserving (mtmp is an
# external Google Form short-link, ntl-summit is a broken stub, articles is
# an empty blog hub with zero posts).
[[redirects]]
  from = "/mtmp/"
  to = "/"
  status = 301
[[redirects]]
  from = "/ntl-summit/"
  to = "/"
  status = 301
[[redirects]]
  from = "/articles/"
  to = "/"
  status = 301

# /home was an early build's homepage route, superseded by / (the LabPage
# rebuild) and retired — mirrors public/.htaccess (production/Apache);
# this file is what actually governs redirects on staging (Netlify).
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/home/"
  to = "/"
  status = 301

# /about-us was a standalone page duplicating the homepage's own #ea-about
# section (mission, values, team) — retired in favor of that section, same
# as /solutions/ above.
[[redirects]]
  from = "/about-us"
  to = "/#ea-about"
  status = 301
[[redirects]]
  from = "/about-us/"
  to = "/#ea-about"
  status = 301

# WordPress/Yoast default junk URLs — theme-builder taxonomy archives, the
# empty default post category, the default author archive, RSS endpoints.
# None of it is real content.
[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/fusion_tb_category/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/element_category/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/feed/"
  to = "/"
  status = 301
[[redirects]]
  from = "/comments/feed/"
  to = "/"
  status = 301

# ── Real routes → their own prerendered file ─────────────────────────────────
# See scripts/prerender.mjs — npm run build now runs it after vite build, so
# these paths exist as real files in dist/prerendered/ with actual page
# content, not just the bare SPA shell. This file governs staging, and
# unlike LawLogic/InsuranceLogic this site's staging is NOT noindexed, so
# it's real crawlable surface area, not just a preview. Netlify checks for a
# matching real file before applying redirects, but these still need to be
# explicit since none of these paths are literal files without the
# /prerendered/ prefix and .html extension.
[[redirects]]
  from = "/contact-us"
  to = "/prerendered/contact-us.html"
  status = 200
[[redirects]]
  from = "/privacy-policy"
  to = "/prerendered/privacy-policy.html"
  status = 200
[[redirects]]
  from = "/terms-conditions"
  to = "/prerendered/terms-conditions.html"
  status = 200
[[redirects]]
  from = "/phoenix-rising-foundation"
  to = "/prerendered/phoenix-rising-foundation.html"
  status = 200
[[redirects]]
  from = "/solutions/lead-generation"
  to = "/prerendered/solutions/lead-generation.html"
  status = 200
[[redirects]]
  from = "/solutions/leadlogic"
  to = "/prerendered/solutions/leadlogic.html"
  status = 200
[[redirects]]
  from = "/solutions/call-center-services"
  to = "/prerendered/solutions/call-center-services.html"
  status = 200
[[redirects]]
  from = "/solutions/media-buys"
  to = "/prerendered/solutions/media-buys.html"
  status = 200
[[redirects]]
  from = "/solutions/social-media-management"
  to = "/prerendered/solutions/social-media-management.html"
  status = 200
[[redirects]]
  from = "/solutions/web-design"
  to = "/prerendered/solutions/web-design.html"
  status = 200

# ── SPA fallback for everything else ─────────────────────────────────────────
# / needs no entry — dist/index.html IS the prerendered homepage after the
# build step above. React Router matches both `/solutions` and `/solutions/`,
# and each page sets its own <link rel="canonical"> to the no-trailing-slash
# URL, so legacy WordPress links like `/solutions/` resolve correctly
# without explicit 301s. (Explicit `from="/x/" -> to="/x"` rules were
# removed — combined with Netlify's Pretty-URLs trailing-slash handling
# they caused an infinite redirect loop.) Genuinely unknown paths (and any
# /solutions/<unknown-slug>, validated client-side rather than 404ing) still
# get index.html at 200 here — Netlify's redirect model doesn't have an
# Apache-style ErrorDocument that preserves a 404 status; that honesty is a
# production/Apache-only property via public/.htaccess.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
